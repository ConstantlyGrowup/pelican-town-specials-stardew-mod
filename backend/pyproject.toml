[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pelican-town-specials"
version = "0.1.0"
description = "Pelican Town Specials - Stardew Valley recipe mod toolkit backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "platformdirs>=4.3,<5",
    "keyring>=25.6,<26",
    "portalocker>=3.2,<4",
    "Pillow>=11.3,<13",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "PyInstaller>=6.14,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pelican_town_specials"]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
