[pytest]
# Task 18 implementation_scope_delta: the packet mandates a root `tests/`
# package, but `backend/tests/` already uses the same top-level `tests` package
# name. With the default "prepend" import mode, pytest imports the wrong `tests`
# package and the plan's combined command
# (`pytest backend/tests/mod_compiler tests/integration/test_release_mod.py`)
# fails collection. --import-mode=importlib imports each test module by file
# path and resolves the collision. `asyncio_mode` is copied here from
# pyproject.toml so creating this file does not change existing behavior.
addopts = --import-mode=importlib
asyncio_mode = auto
