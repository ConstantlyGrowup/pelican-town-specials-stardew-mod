# Shared Windows verify-and-build pipeline (Milestone 7 Task 24).
#
# Reusable workflow called by both ci.yml (push/PR) and release.yml (v* tag /
# manual dispatch). This is the single verified pipeline: full tests, frontend,
# PyInstaller onedir bundle, bundle smoke, Inno Setup installer and installer
# smoke. If any gate fails, the run fails and no artifact is promoted.
#
# The version input drives the installer filename and release assets. A
# version-drift gate (scripts/check_release_version.ps1) fails the build if the
# requested version does not match packaging/pyinstaller/version_info.txt, so a
# Release can never carry a mislabeled artifact.
# v1.5.5 (2026-09-05): Trial provider migrated to the new quota-managed site.
# v1.5.3 (2026-09-02): Task 47 — public trial uses gpt-image-2 with five
# opportunities; legacy trial state resets once on upgrade and personal settings stay unchanged.
# v1.5.2 (2026-09-01): Localized generation error banners for the English UI.
# v1.5.0 (2026-08-31): Milestone 11 — trial recovery UX and blueprint selection removal.
name: build-and-verify

on:
  workflow_call:
    inputs:
      version:
        description: Release version without a leading v (e.g. 1.5.5)
        required: false
        default: '1.5.5'
        type: string
      telemetry_host:
        description: HTTPS origin for the public Release telemetry capture endpoint; empty keeps telemetry disabled.
        required: false
        default: ''
        type: string
      telemetry_project_token:
        description: Public PostHog project token for a configured Release; empty keeps telemetry disabled.
        required: false
        default: ''
        type: string
      telemetry_enabled_for_build:
        description: Explicit Release gate; must be true together with the host and project token.
        required: false
        default: false
        type: boolean
    secrets:
      PTS_TRIAL_API_KEY:
        description: Trial API key injected into the gitignored resources/trial/trial_api_key.txt bundle resource.
        required: false

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install backend dependencies (per pyproject.toml)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .

      - name: Install frontend dependencies (per pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: OpenAPI generate and drift check
        run: pwsh -NoProfile -File scripts/check_openapi_drift.ps1

      - name: Ruff lint
        run: python -m ruff check backend

      - name: Mypy type check
        run: python -m mypy backend/src

      - name: Backend, repo and integration tests
        run: python -m pytest backend/tests tests/repo tests/integration -q

      - name: Product copy gate
        run: python scripts/check_product_copy.py

      - name: Frontend locale gate
        run: python scripts/check_frontend_locale.py

      - name: Frontend unit tests
        run: pnpm --dir frontend test:run

      - name: Frontend lint
        run: pnpm --dir frontend lint

      - name: Frontend build
        run: pnpm --dir frontend build

      - name: Install Playwright browser
        run: pnpm --dir frontend exec playwright install chromium

      - name: Playwright fake E2E
        run: pnpm --dir frontend e2e

      - name: Inject trial API key resource
        shell: pwsh
        run: |
          if ($env:PTS_TRIAL_API_KEY) {
            New-Item -ItemType Directory -Force resources/trial | Out-Null
            Set-Content -Path resources/trial/trial_api_key.txt -Value $env:PTS_TRIAL_API_KEY -NoNewline -Encoding ascii
          }
        env:
          PTS_TRIAL_API_KEY: ${{ secrets.PTS_TRIAL_API_KEY }}

      - name: Build Windows bundle
        shell: pwsh
        env:
          PTS_TELEMETRY_HOST: ${{ inputs.telemetry_host }}
          PTS_TELEMETRY_PROJECT_TOKEN: ${{ inputs.telemetry_project_token }}
          PTS_TELEMETRY_ENABLED_FOR_BUILD: ${{ inputs.telemetry_enabled_for_build }}
        run: |
          $enabled = $env:PTS_TELEMETRY_ENABLED_FOR_BUILD.Trim().ToLowerInvariant() -eq 'true'
          $telemetryArguments = @(
            '-TelemetryHost', $env:PTS_TELEMETRY_HOST,
            '-TelemetryProjectToken', $env:PTS_TELEMETRY_PROJECT_TOKEN
          )
          if ($enabled) {
            $telemetryArguments += '-TelemetryEnabledForBuild'
          }
          pwsh -NoProfile -File scripts/build_windows.ps1 @telemetryArguments

      - name: Smoke test Windows bundle
        run: pwsh -NoProfile -File scripts/smoke_windows_bundle.ps1

      - name: Install Inno Setup (pinned 6.7.3)
        run: pwsh -NoProfile -File scripts/install_innosetup.ps1 -InstallDir "${{ github.workspace }}\tools\innosetup"

      - name: Build Windows installer
        run: pwsh -NoProfile -File scripts/build_installer.ps1 -IsccPath "${{ github.workspace }}\tools\innosetup\ISCC.exe" -Version "${{ inputs.version }}"

      - name: Smoke test Windows installer
        run: pwsh -NoProfile -File scripts/smoke_installer.ps1 -SetupExe "dist\installer\PelicanTownSpecials-Setup-v${{ inputs.version }}.exe"

      - name: Release version drift gate
        run: pwsh -NoProfile -File scripts/check_release_version.ps1 -Version "${{ inputs.version }}"

      - name: Build portable ZIP
        run: |
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          Compress-Archive -Path dist/PelicanTownSpecials-windows-x64 -DestinationPath "dist/installer/PelicanTownSpecials-windows-x64-v${{ inputs.version }}.zip" -Force

      - name: Generate release notes
        run: pwsh -NoProfile -File scripts/generate_release_notes.ps1 -Version "${{ inputs.version }}" -OutputFile RELEASE_NOTES.md

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: pelican-town-specials-windows-x64
          path: dist/PelicanTownSpecials-windows-x64
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pelican-town-specials-setup-${{ inputs.version }}
          path: dist/installer/PelicanTownSpecials-Setup-v${{ inputs.version }}.exe
          if-no-files-found: error

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pelican-town-specials-windows-x64-${{ inputs.version }}-zip
          path: dist/installer/PelicanTownSpecials-windows-x64-v${{ inputs.version }}.zip
          if-no-files-found: error

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
