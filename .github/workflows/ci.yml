# CI: verify the MVP build end-to-end and produce a release candidate.
#
# CI runs on every push/PR and never publishes. The verified pipeline lives in
# the reusable .github/workflows/build.yml (full tests → PyInstaller bundle →
# bundle smoke → Inno installer → installer smoke → artifacts); release.yml
# reuses the same pipeline on v* tags / manual dispatch and is the only path
# that can create a GitHub Release.
name: ci

on:
  push:
    branches:
      - feat/mvp-implementation
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build:
    uses: ./.github/workflows/build.yml
    secrets:
      PTS_TRIAL_API_KEY: ${{ secrets.PTS_TRIAL_API_KEY }}
